<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .container{
            background-color: antiquewhite;
            border: brown 2px solid;
            /* padding: 20px; */
            display: flex;
            justify-content:flex-end; 
            /* align horizontal along main axis */
            min-height: 700px;
            align-items: flex-start;
            /* align vertical along cross axis */

            flex-direction: row;
            column-gap: 10px;
            row-gap: 10px;
            flex-wrap: wrap;
        }
        .item{
            background-color: lightcoral;
            border: 1px solid green;
            padding: 10px;
        }
    </style>
</head>
<body>
    <!-- To create responsive layout of your webpage -->
     <div class="container">
        <div class="item">Section 1</div>
        <div class="item">Section 2</div>
        <div class="item">Section 3</div>
        <div class="item">Section 4</div>
        <div class="item">Section 5</div>
        <div class="item">Section 6</div>  
    </div>

</body>
</html>
