<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="f1">First Name:</label>
        <input type="text" id="f1" 
        name="firstname" maxlength="8" placeholder="Enter Firstname">
        <br><br>
        <label for="l1">Last Name:</label>
        <input type="text" id="l1" name="lastname">

        <br><br>
         <label for="p1">Password:</label>
        <input type="password" id="p1" name="Password">

        <br><br>
         <label for="e1">Email:</label>
        <input type="email" id="e1" name="email">

        <br><br>

        <label for="review">Enter Review:</label><br>
        <textarea name="review" id="review" 
        rows="10" cols="50"></textarea>





    </form>
</body>
</html>
