<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Audio tag</h3>

    <audio controls autoplay muted loop>
        <source src="/Audio/birds.wav" type="audio/wav">
    </audio>

    <video controls width="200" height="200" poster="/Images/butterfly.avif">
        <source src="/Video/city.mp4" type="video/mp4">
    </video>

    <br>
    <br>
    <svg width="300" height="300">
        <rect width="50" height="40" fill="blue" x="50" y="100"></rect>
        <circle cx="150" cy="100" r="30" fill="yellow"></circle>
        <ellipse cx="50" cy="200" rx="30" ry="20" fill="green"></ellipse>
        <line x1="50" y1="50" x2="70" y2="70" stroke="blue" width="5"></line>
    </svg>

    <svg width="200" height="200">
        <polygon fill="grey" points="20 40 40 10 60 30"></polygon>

    </svg>

   

</body>
</html>
