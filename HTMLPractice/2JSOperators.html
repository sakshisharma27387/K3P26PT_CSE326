<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Arithmetic Operators
        // let x = 90;
        // let y = 20;
        // console.log(x+y, x-y, x*y, x/y, x%y);
        var q = 70;
        console.log(q++);//70
        console.log(q);//71

        //Assignment Operators
        let x1 = 10;
        let y1= 20;
        console.log(x1+=y1,x1-=y1, x1*=y1);
        
        //Comparison Operators

        let x2 = 90;
        let y2 = 10;
        console.log(x2>=y2);

        //Logical
        let x = 90;
        let y =10;
        console.log(x>y && x<=y)
        console.log(x<y || x>=y)
        console.log(!(x>y))
        console.log(!(x<y))

        //Branching Statements

        let marks = 70;
        if(marks>=90){
            console.log("Elite batch");
        }
        else if(marks>=75){
            console.log("Intermediate batch")
        }
        else if(marks>=60){
            console.log("Regular Batch")
        }
        else{
            console.log("Fail");
        }

        // Looping statements

        // for(let i = 3; i<=15; i++){
        //     console.log(i);
        // }

        let j = 11;
        while(j<=10){
            console.log(j);
            j++;
        }


        let k = 91;
        do{
            console.log(k);
            k++;
        }while(k<=90)
    </script>
</body>
</html>
